# Maliyetli uçlar: bir adres ortalama saniyede 2 istek yapabilir.
limit_req_zone $binary_remote_addr zone=costly:10m rate=2r/s;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Adres her istekte çözülür; api yeniden oluşturulunca nginx eski adreste kalmaz.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;

        location ~ ^/api/(ask|speak|transcribe)$ {
            limit_req zone=costly burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://$api_upstream;
        }
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
