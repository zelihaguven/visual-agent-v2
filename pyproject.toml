[project]
name = "visual-agent"
version = "0.1.0"
description = "Belgelere kaynak göstererek cevap veren soru-cevap aracı"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdfium2>=5.15.1",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.15",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
retrieval = [
    "fastembed>=0.7",
    "sentence-transformers>=5.0",
    "torch>=2.5",
]
ingest = [
    "docling>=2.137",
    "numpy>=1.26",
    "ocrmypdf>=16.10",
    "openpyxl>=3.1.5",
    "pikepdf>=9.0",
    "pillow>=11.0",
    "pypdfium2>=4.30",
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
    "torch>=2.5",
    "torchvision>=0.20",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.13",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=visual_agent --cov=apps --cov=evals --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["*/ingest/tools.py", "*/ingest/docling_parser.py", "*/retrieval/encoders.py", "apps/api/services.py", "apps/worker/indexing.py", "evals/ingest_check.py", "evals/run_questions.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "apps", "evals", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
module = ["fastembed.*", "sentence_transformers.*", "docling.*", "numpy.*", "docx.*", "openpyxl.*", "pikepdf.*", "pypdfium2.*", "rapidocr.*", "reportlab.*"]
ignore_missing_imports = true
