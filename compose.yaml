name: visual-agent

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment: &app-environment
      VA_AUTH_ENABLED: ${VA_AUTH_ENABLED:-false}
      VA_QDRANT_URL: http://qdrant:6333
      VA_DATABASE_PATH: /data/db/visual_agent.db
      VA_OPENROUTER_API_KEY: ${VA_OPENROUTER_API_KEY:-}
      VA_STORAGE_DIRECTORY: /data/documents
    volumes: &app-volumes
      - documents_data:/data/documents
      - database_data:/data/db
      - model_cache:/home/appuser/.cache
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: ingest
    restart: unless-stopped
    command: ["python", "-m", "apps.worker.main"]
    environment: *app-environment
    volumes:
      - documents_data:/data/documents
      - database_data:/data/db
      - model_cache:/home/appuser/.cache
      - docling_models:/opt/docling-models
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    build: ./apps/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  documents_data:
  model_cache:
  docling_models:
  qdrant_data:
  database_data:
