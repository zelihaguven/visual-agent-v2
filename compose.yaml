name: visual-agent

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: visual_agent
      POSTGRES_DB: visual_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env dosyasında POSTGRES_PASSWORD tanımlayın}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visual_agent -d visual_agent"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment: &app-environment
      VA_AUTH_ENABLED: ${VA_AUTH_ENABLED:-false}
      VA_QDRANT_URL: http://qdrant:6333
      VA_DATABASE_URL: postgresql://visual_agent:${POSTGRES_PASSWORD}@postgres:5432/visual_agent
      VA_OPENROUTER_API_KEY: ${VA_OPENROUTER_API_KEY:-}
      VA_STORAGE_DIRECTORY: /data/documents
    volumes: &app-volumes
      - documents_data:/data/documents
      - model_cache:/home/appuser/.cache
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: ingest
    command: ["python", "-m", "apps.worker.main"]
    environment: *app-environment
    volumes:
      - documents_data:/data/documents
      - model_cache:/home/appuser/.cache
      - docling_models:/opt/docling-models
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  documents_data:
  model_cache:
  docling_models:
  qdrant_data:
  postgres_data:
